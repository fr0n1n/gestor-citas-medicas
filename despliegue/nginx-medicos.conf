# nginx delante de Medicos, en el mismo servidor que el contenedor.
#
# Copialo a /etc/nginx/sites-available/ (o conf.d/), ajusta las rutas del
# certificado y recarga: sudo nginx -t && sudo systemctl reload nginx
#
# En el .env del servidor:
#     MEDICOS_IP_ESCUCHA=127.0.0.1      (el valor por defecto)
#     MEDICOS_HOSTS_PERMITIDOS=citas.ejemplo.com

server {
    listen 80;
    listen [::]:80;
    server_name citas.ejemplo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name citas.ejemplo.com;

    ssl_certificate     /etc/letsencrypt/live/citas.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citas.ejemplo.com/privkey.pem;

    # nginx limita cada peticion a 1 MB por defecto, y una foto de movil
    # pesa 3-8 MB. La app admite hasta 10 ficheros de 20 MB por subida.
    client_max_body_size 210m;

    # Solo HTTPS a partir de la primera visita.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # OPCIONAL, si la app esta abierta a internet sin otra capa delante
    # (VPN o Cloudflare Access, ver README "Como abrirla desde fuera de
    # casa"): limita los intentos de login por IP, ademas del bloqueo por
    # usuario que hace la propia app. Descomenta esta location y, FUERA del
    # bloque server (al principio de este fichero), la linea:
    #   limit_req_zone $binary_remote_addr zone=medicos_login:10m rate=10r/m;
    #
    # location = /login {
    #     limit_req zone=medicos_login burst=5 nodelay;   # 10/min, rafaga de 5
    #     limit_req_status 429;                           # "demasiadas peticiones"
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    location / {
        proxy_pass http://127.0.0.1:8080;

        # El nombre original: la app solo responde a los de su lista
        # (MEDICOS_HOSTS_PERMITIDOS).
        proxy_set_header Host $host;
        # Que el navegador llega por HTTPS: la cookie de sesion se marca
        # como segura.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Subir varias fotos desde el movil con mala cobertura puede tardar.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# --- Nginx Proxy Manager (contenedor) ---------------------------------------
# Si usas NPM en vez de nginx del sistema, no hace falta este fichero: crea un
# Proxy Host desde su interfaz con estos valores, y en la pestana Advanced
# anade "client_max_body_size 210m;" (el resto de cabeceras ya las pone NPM):
#
#   Domain Names:      medicos.tudominio.com
#   Scheme:            http
#   Forward Hostname:  <IP del servidor>      (o el nombre del contenedor si
#   Forward Port:       8085                   comparten red de Docker)
#   Block Common Exploits:  si
#   Websockets Support:     no hace falta
#   SSL: pedir certificado Let's Encrypt + Force SSL + HTTP/2

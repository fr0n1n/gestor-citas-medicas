# Las pruebas de la logica no necesitan instalar nada: son de biblioteca
# estandar, y las que dependen de la aplicacion se saltan solas. Por eso
# aqui no hay ni un `pip install`.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 es la de la imagen de Docker; las otras, por si acaso.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas
        run: python -m unittest discover -s tests -t . -v

  # Vulnerabilidades conocidas en las librerias que de verdad se despliegan:
  # las versiones fijadas a mano en el Dockerfile (no las de pyproject, que
  # son minimos). Asi se detecto el 2026-10-28 que pillow 11.3.0 tenia seis
  # CVE publicados. Este trabajo si instala algo: pip-audit, solo para mirar.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versiones del Dockerfile
        # Saca cada "paquete==version" del RUN pip install del Dockerfile.
        run: grep -oE '"[A-Za-z0-9_.\[\]-]+==[0-9][0-9A-Za-z.]*"' Dockerfile | tr -d '"' | tee requisitos-imagen.txt
      - name: pip-audit
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requisitos-imagen.txt
